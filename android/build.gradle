buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects { subproject ->
    subproject.ext.kotlinVersion = rootProject.ext.has("kotlinVersion")
        ? rootProject.ext.get("kotlinVersion")
        : "2.2.0"

    subproject.plugins.withId("com.android.library") {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt == null) {
            return
        }
        def currentNamespace = null
        try {
            currentNamespace = androidExt.namespace
        } catch (Exception ignored) {
            currentNamespace = null
        }
        if (currentNamespace != null) {
            return
        }
        def manifestFile = subproject.file("src/main/AndroidManifest.xml")
        if (!manifestFile.exists()) {
            return
        }
        def matcher = manifestFile.getText("UTF-8") =~ /package="([^"]+)"/
        if (matcher.find()) {
            androidExt.namespace = matcher.group(1)
        }
    }
}
